<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Disaster Management Master Mock Test — 40 Questions | Central Scoreboard</title>
<style>
:root{--bg:#000;--panel:#090909;--panel2:#111;--line:#292929;--text:#fff;--muted:#aaa;--green:#18e76b;--red:#ff3152;--gold:#ffd45a;--blue:#5f8cff}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
body.light{--bg:#f4f6fa;--panel:#fff;--panel2:#f1f3f7;--line:#d8dce5;--text:#111;--muted:#626a78;--gold:#8b5d00;--blue:#315fce}
button,input{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.hidden{display:none!important}
.topbar{position:fixed;left:0;right:0;top:0;height:68px;z-index:50;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:8px 12px;background:rgba(0,0,0,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
body.light .topbar{background:rgba(255,255,255,.95)}
.leftbox{justify-self:start}
.rightbox{justify-self:end;display:flex;align-items:center;gap:8px}
.centerbox{justify-self:center;text-align:center;min-width:100px}
.themeBtn,.adminBtn,.correctBtn{border:1px solid #444;border-radius:11px;padding:9px 12px;background:#111;color:#fff;font-weight:1000;letter-spacing:.03em}
body.light .themeBtn,body.light .adminBtn,body.light .correctBtn{background:#fff;color:#111;border-color:#c4c9d3}
.adminBtn{background:var(--gold);color:#000;border-color:var(--gold)}
.correctBtn{display:block;margin:auto;background:#0b301b;border-color:#1e9c52;color:#69ff9d;min-width:110px}
.timer{margin-top:3px;font-variant-numeric:tabular-nums;font-size:18px;font-weight:1000;letter-spacing:.04em}
.timer.warn{color:#fff!important;animation:timerBlink .48s steps(2,start) infinite!important;transform:scale(1.32);text-shadow:0 0 6px #fff,0 0 16px var(--red),0 0 32px var(--red),0 0 48px #ff8a00;font-size:clamp(24px,4vw,34px)!important;letter-spacing:.08em}@keyframes timerBlink{0%,100%{opacity:1;filter:brightness(1.2);transform:scale(1.32)}50%{opacity:.28;filter:brightness(2.3);transform:scale(1.5)}}
.screen{position:fixed;inset:68px 0 0;display:flex;align-items:center;justify-content:center;padding:18px}
.startCard{width:min(560px,92vw);background:linear-gradient(180deg,#101010,#070707);border:1px solid #2a2a2a;border-radius:24px;padding:30px;box-shadow:0 25px 90px rgba(0,0,0,.65)}
body.light .startCard{background:#fff;border-color:#d8dce5;box-shadow:0 20px 60px rgba(0,0,0,.10)}
.brand{margin:0;text-align:center;font-size:clamp(30px,6vw,46px);font-weight:1000;letter-spacing:.10em}
label{display:block;margin:28px 0 9px;font-weight:1000;font-size:18px}
.name{width:100%;height:56px;border:1px solid #3a3a3a;border-radius:14px;background:#050505;color:#fff;padding:0 16px;outline:none;font-weight:800;font-size:18px}
body.light .name{background:#f8f9fc;color:#111;border-color:#cfd4de}
.name:focus{border-color:var(--blue)}
.startBtn{width:100%;height:58px;margin-top:12px;border:0;border-radius:14px;background:#fff;color:#000;font-weight:1000;font-size:18px;letter-spacing:.04em}
.exam{position:fixed;inset:68px 0 0;height:calc(100dvh - 68px);padding:10px 12px}
.examInner{height:100%;max-width:1100px;margin:auto;display:flex;flex-direction:column;min-height:0}
.progress{height:28px;display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:13px;font-weight:900;padding:0 3px}
.progressTrack{height:8px;width:100%;background:#ff3152;border-radius:999px;overflow:hidden;margin:0 3px 7px;box-shadow:0 0 8px rgba(255,49,82,.28)}
.progressFill{height:100%;width:0%;background:#18e76b;border-radius:999px;transition:width .25s ease;box-shadow:0 0 10px rgba(24,231,107,.55)}
.qcard{flex:1;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:clamp(14px,2.2vh,22px);display:flex;flex-direction:column;box-shadow:0 18px 70px rgba(0,0,0,.35)}
.qnum{color:var(--gold);font-weight:1000;font-size:15px;margin-bottom:7px}
.question{font-size:clamp(16px,2.3vh,21px);line-height:1.38;font-weight:800;max-width:1000px}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:clamp(12px,2vh,18px)}
.opt{min-height:54px;border:1px solid #333;border-radius:13px;background:var(--panel2);color:var(--text);padding:11px 13px;text-align:left;display:flex;gap:10px;align-items:flex-start;font-weight:750;line-height:1.28;font-size:clamp(14px,1.9vh,17px);transition:.12s}
.opt:active{transform:scale(.995)}
.opt.selected{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue) inset}
.opt.correct{background:#0a321a;border-color:var(--green);color:#c9ffdc}
.opt.wrong{background:#3a0811;border-color:var(--red);color:#ffd1d8}
.letter{font-weight:1000;min-width:24px}
.feedback{min-height:26px;margin-top:7px;font-size:13px;font-weight:1000;max-height:30vh;overflow-y:auto;padding-right:4px;line-height:1.5;flex-shrink:0}
.feedback.ok{color:var(--green)} .feedback.bad{color:var(--text)}
.wrong-title{color:var(--red);font-size:16px;font-weight:1000;margin-bottom:6px}.explain{color:var(--green);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;max-height:30vh;overflow-y:auto;line-height:1.6;font-weight:750}
.timer.warn{color:#fff;background:linear-gradient(135deg,#ff1744,#ff6b00,#ffd400,#ff1744);background-size:300% 300%;padding:6px 14px;border-radius:14px;font-size:clamp(22px,4vw,34px);line-height:1;box-shadow:0 0 10px #ff1744,0 0 24px #ff6b00,0 0 42px rgba(255,212,0,.8);text-shadow:0 0 7px #fff,0 0 16px #ff1744;animation:timerGlow 1.15s ease-in-out infinite,timerGradient 2s linear infinite;transform:scale(1.12)}
@keyframes timerGlow{0%,100%{opacity:1;transform:scale(1.12)}50%{opacity:.55;transform:scale(1.22)}}
@keyframes timerGradient{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.actions{margin-top:auto;padding-top:10px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;flex-shrink:0;background:var(--panel)}
.next{width:min(240px,100%);height:54px;border:2px solid #fff;border-radius:14px;background:#fff;color:#000;font-weight:1000;font-size:18px;transition:.12s;flex-shrink:0}.next.answer-correct{background:var(--green);border-color:var(--green);color:#001b0a}.next.answer-wrong{background:var(--red);border-color:var(--red);color:#fff;animation:shake .45s ease-in-out 0s 2}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.next:disabled{opacity:.35;cursor:not-allowed}
.next.tap-vibrate{animation:buttonVibrate .34s linear}
@keyframes buttonVibrate{0%,100%{transform:translateX(0) scale(1)}20%{transform:translateX(-6px) scale(1.02)}40%{transform:translateX(6px) scale(1.02)}60%{transform:translateX(-5px) scale(1.02)}80%{transform:translateX(4px) scale(1.01)}}
.revisionBox{margin-top:18px;padding:16px;border:1px solid #ff3152;border-radius:16px;background:linear-gradient(135deg,rgba(255,49,82,.12),rgba(255,212,90,.08));box-shadow:0 0 24px rgba(255,49,82,.12)}
.revisionTitle{font-size:18px;font-weight:1000;color:#ffd45a}
.revisionInfo{margin-top:5px;color:var(--muted);font-weight:750;line-height:1.45}
.revisionBtn{margin-top:11px;width:100%;min-height:54px;border:2px solid #ffd45a;border-radius:13px;background:linear-gradient(90deg,#5b0010,#9d1230,#5b0010);background-size:200% 100%;color:#fff;font-weight:1000;font-size:17px;box-shadow:0 0 12px rgba(255,49,82,.5);animation:revisionPulse 1.5s ease-in-out infinite}
@keyframes revisionPulse{0%,100%{box-shadow:0 0 10px rgba(255,49,82,.45)}50%{box-shadow:0 0 26px rgba(255,212,90,.8)}}
.result,.admin{position:fixed;inset:68px 0 0;overflow:auto;padding:18px}
.resultCard,.adminCard{width:min(1150px,100%);margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:22px}
.resultTitle{text-align:center;font-weight:1000;letter-spacing:.08em;margin:0}
.candidate{text-align:center;color:var(--muted);font-weight:800;margin-top:7px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:18px}
.stat{border:1px solid var(--line);background:var(--panel2);border-radius:14px;padding:13px}
.stat small{display:block;color:var(--muted);font-weight:800}
.stat strong{display:block;font-size:22px;margin-top:4px;font-weight:1000}
.review{margin-top:20px;display:grid;gap:9px}
.reviewRow{border:1px solid var(--line);border-radius:13px;padding:13px;background:var(--panel2)}
.reviewQ{font-weight:900;line-height:1.35}
.reviewA{margin-top:7px;color:var(--muted);font-size:14px;line-height:1.4}
.tag{display:inline-block;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:1000;margin-left:5px}
.ok{background:#123e23;color:#70ff9f} .bad{background:#470b17;color:#ff91a4} .skip{background:#303030;color:#bbb}
.resultActions,.adminTools{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
.resultActions button,.adminTools button{border:1px solid #444;border-radius:11px;padding:11px 13px;background:#111;color:#fff;font-weight:900}
body.light .resultActions button,body.light .adminTools button{background:#fff;color:#111;border-color:#c4c9d3}
.danger{border-color:#9d253b!important;color:#ff91a4!important}
.adminHead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.adminTitle{margin:0;font-weight:1000}
.tableWrap{overflow:auto;margin-top:16px}
table{width:100%;border-collapse:collapse;min-width:900px}
th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--muted);font-size:12px}
.empty{padding:30px;text-align:center;color:var(--muted);font-weight:800}
.status{margin-top:10px;text-align:center;font-size:12px;font-weight:1000}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1000}
@media(max-width:700px){
 .topbar{height:62px;padding:6px 6px;grid-template-columns:auto 1fr auto;gap:4px;overflow:visible}
 .leftbox{min-width:0;overflow:visible}
 .topButtons{gap:4px;flex-wrap:nowrap}
 .screen,.exam,.result,.admin{inset:62px 0 0}
 .exam{height:calc(100dvh - 62px);padding:7px 8px}
 .themeBtn,.adminBtn,.correctBtn{font-size:9px;padding:7px 6px;border-radius:9px;letter-spacing:0}
 .viewBtn{display:inline-flex!important;visibility:visible!important;opacity:1!important;font-size:8px;padding:7px 5px}
 .correctBtn{min-width:68px;padding-left:5px;padding-right:5px}
 .centerbox{min-width:68px}
 .timer{font-size:15px}
 .adminBtn{font-size:8px;padding:7px 5px}
 .startCard{padding:23px}
 .options{grid-template-columns:1fr;gap:7px}
 .opt{min-height:49px;padding:9px 11px}
 .qcard{border-radius:16px;padding:13px}
 .progress{height:24px;font-size:11px}
 .next{height:52px;width:100%}
 .stats{grid-template-columns:repeat(2,1fr)}
 .result,.admin{padding:10px}
}
@media(max-width:360px){
 .topbar{padding-left:4px;padding-right:4px;gap:2px}
 .topButtons{gap:2px}
 .themeBtn{font-size:8px;padding:6px 4px}
 .viewBtn{font-size:7px;padding:6px 4px}
 .adminBtn{font-size:7px;padding:6px 4px}
 .correctBtn{font-size:8px;min-width:62px}
 .timer{font-size:14px}
}
@media(max-height:620px) and (orientation:landscape){
 .question{font-size:15px;line-height:1.25}
 .opt{min-height:42px;font-size:13px;padding:7px 9px}
 .options{gap:6px;margin-top:7px}
 .qcard{padding:10px}
 .next{height:45px}
}
@media print{
 html,body{overflow:visible;background:#fff!important;color:#000!important}
 .topbar,.resultActions,.adminTools,#fx{display:none!important}
 .result,.admin{position:static;overflow:visible;padding:0}
 .resultCard,.adminCard{border:0;box-shadow:none}
}

.topButtons{display:flex;align-items:center;gap:6px}
.viewBtn{font-size:10px;padding:7px 9px;white-space:nowrap}
.viewModeWrap{position:absolute;inset:0;overflow:auto;padding:18px 12px 90px;background:var(--bg)}
.viewModeInner{width:min(1100px,100%);margin:auto}
.viewModeHeader{position:sticky;top:0;z-index:4;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;font-weight:1000;display:flex;justify-content:space-between;gap:10px}
.viewModeHeader span{color:var(--muted);font-size:12px}
.viewQuestion{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:10px}
.viewQuestion .question{margin-bottom:10px}
.viewQuestion .options{margin-top:8px}
.viewOnlyOpt{pointer-events:none!important;cursor:default!important;opacity:1!important}
.viewModeExit{position:sticky;bottom:0;width:100%;height:54px;border:2px solid #fff;border-radius:14px;background:#fff;color:#000;font-weight:1000;font-size:17px;margin-top:8px}
body.light .viewModeExit{border-color:#111}
@media(max-width:700px){
  .viewBtn{font-size:9px;padding:7px 7px}
  .viewModeWrap{padding:10px 8px 76px}
  .viewModeHeader{font-size:12px;padding:10px}
  .viewQuestion{padding:13px}
}

</style>

<style id="LAST10_BLINK_30_MIN">
#timer.warn{
  color:#ff0000 !important;
  background:transparent !important;
  border:0 !important;
  box-shadow:none !important;
  text-shadow:none !important;
  animation:last10Blink 0.85s steps(1,end) infinite !important;
}
@keyframes last10Blink{0%,49%{opacity:1;visibility:visible}50%,100%{opacity:.15;visibility:visible}}
</style>

<style id="revision-banner-style">#revisionBanner{display:none;text-align:center;font-weight:800;font-size:22px;line-height:1.4;margin:12px 0;padding:0;background:none;border:none;box-shadow:none;}
#revisionBanner.show{display:block}
.revisionStar{color:red;font-weight:800;animation:revisionBlink 1s step-end infinite;text-shadow:none;background:none;}
.revisionText{color:#16a34a;font-weight:800;animation:revisionBlink 1s step-end infinite;text-shadow:none;background:none;}
@keyframes revisionTextBlink{0%,100%{opacity:1;filter:brightness(1.1)}50%{opacity:.22;filter:brightness(2.4)}}
@keyframes revisionStarBlink{0%,100%{opacity:1;filter:brightness(1.1)}50%{opacity:.18;filter:brightness(2.5)}}</style>
<style id="revisionTextFix">
.revisionText{
  color:#ff0000 !important;
  font-weight:900 !important;
  font-size:1.12em !important;
  text-shadow:none !important;
  background:none !important;
  border:none !important;
  animation:revisionTextBlink 0.8s steps(1,end) infinite !important;
}
@keyframes revisionTextBlink{
  0%,49%{opacity:1;visibility:visible}
  50%,100%{opacity:0;visibility:hidden}
}
</style>
<style id="REAL_EXAM_LAST10_TIMER_ONLY">
#timer.real-exam-last10{
  color:#ff0000 !important;
  background:transparent !important;
  background-color:transparent !important;
  border:0 !important;
  box-shadow:none !important;
  text-shadow:none !important;
  animation:realExamLast10Blink 1.8s ease-in-out infinite !important;
}
@keyframes realExamLast10Blink{
  0%,100%{opacity:1}
  50%{opacity:.45}
}
</style>
<style id="CONTINUE_TOUCH_SHAKE_V2">
#continueBtn{transform-origin:center center;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#continueBtn.continue-touch-shake{animation:continueTouchShake .34s cubic-bezier(.36,.07,.19,.97) both!important}
@keyframes continueTouchShake{0%{transform:translate3d(0,0,0) scale(1)}12%{transform:translate3d(-7px,0,0) scale(1.01)}24%{transform:translate3d(7px,0,0) scale(1.02)}36%{transform:translate3d(-6px,0,0) scale(1.01)}48%{transform:translate3d(6px,0,0) scale(1.02)}60%{transform:translate3d(-4px,0,0) scale(1.01)}72%{transform:translate3d(4px,0,0) scale(1.01)}84%{transform:translate3d(-2px,0,0) scale(1)}100%{transform:translate3d(0,0,0) scale(1)}}
</style>

<style id="REVISION_CONTINUE_VIBRATION_FIX">
#nextBtn.tap-vibrate{animation:buttonVibrate .34s linear!important;transform-origin:center center}
</style>
</head>
<body>
<div id="viewScreen" class="hidden" style="position:fixed;inset:0;z-index:200;background:var(--bg);"></div>
<!-- Background music disabled for this test. -->

<!-- Background music script removed: music OFF. -->


<canvas id="fx"></canvas>

<header class="topbar">
  <div class="leftbox"><div class="topButtons"><button id="themeBtn" class="themeBtn" type="button">☀ THEME</button><button id="viewBtn" class="themeBtn viewBtn" type="button">VIEW QUESTIONS</button></div></div>
  <div class="centerbox">
    <button id="correctBtn" class="correctBtn" type="button">CORRECT: 0</button>
    <div id="timer" class="timer">30:00</div>
  </div>
  <div class="rightbox"><button id="adminBtn" class="adminBtn" type="button">ADMIN PORTAL</button></div>
</header>

<section id="start" class="screen">
  <div class="startCard">
    <h1 class="brand">MOCK TEST</h1>
    <label for="candidate">Candidate Name</label>
    <input id="candidate" class="name" autocomplete="name" spellcheck="false">
    <button id="startBtn" class="startBtn" type="button">EXAM START</button>
  </div>
</section>

<section id="exam" class="exam hidden">
  <div class="examInner">
    <div class="progress"><span id="progress"></span><span id="sectionLabel"></span></div><div class="progressTrack" aria-label="Exam progress"><div id="progressFill" class="progressFill"></div></div>
    <div id="revisionBanner"><span class="revisionStar">★</span> <span class="revisionText">যেগুলি ভুল করলাম</span> <span class="revisionStar">★</span></div><div id="qcard" class="qcard"></div>
  </div>
</section>

<section id="result" class="result hidden"></section>

<section id="admin" class="admin hidden">
  <div class="adminCard">
    <div class="adminHead">
      <div><h2 class="adminTitle">ADMIN PORTAL</h2></div>
      <div class="adminTools">
        <button id="refreshAdmin">REFRESH RESULTS</button>
        <button id="csvAdmin">DOWNLOAD RESULTS CSV</button>
        <button id="printAdmin">PRINT / SAVE PDF REPORT</button>
        <button id="clearAdmin" class="danger">CLEAR ALL RESULTS</button>
      </div>
    </div>
    <div id="adminTable"></div>
  </div>

<script>

function submitToCentralScoreboard(r){
  const status=$("centralStatus");
  const payload={
    token:CENTRAL_API_TOKEN,
    testId:BACKEND_TEST_ID,
    candidateName:String(r.candidate||"").trim(),
    candidate:String(r.candidate||"").trim(),
    score:Number(r.score)||0,
    percentage:Number(r.percentage)||0,
    timeUsed:Number(r.timeUsed)||0,
    correct:Number(r.correct)||0,
    incorrect:Number(r.incorrect)||0,
    attempted:Number(r.attempted)||0,
    unanswered:Number(r.unanswered)||0,
    durationSeconds:Number(r.durationSeconds)||Number(DURATION)||0,
    submissionId:String(r.id||""),
    startExam:r.startExam||examStartAt||"",
    date:r.completedAt,
    startExam:r.startExam || r.startAt || ""
  };
  const body=JSON.stringify(payload);
  if(status){
    status.textContent="";
    status.style.color="var(--green)";
  }

  let sent=false;
  try{
    if(navigator.sendBeacon){
      sent=navigator.sendBeacon(
        CENTRAL_SCOREBOARD_URL,
        new Blob([body],{type:"text/plain;charset=UTF-8"})
      );
    }
  }catch(e){ sent=false; }

  if(sent){
    if(status){
      status.textContent="";
      status.style.color="var(--green)";
    }
    return Promise.resolve();
  }

  return fetch(CENTRAL_SCOREBOARD_URL,{
    method:"POST",
    mode:"no-cors",
    redirect:"follow",
    credentials:"omit",
    headers:{"Content-Type":"text/plain;charset=UTF-8"},
    body:body,
    keepalive:true
  }).then(()=>{
    if(status){
      status.textContent="";
      status.style.color="var(--green)";
    }
  }).catch(()=>{
    if(status){
      status.textContent="";
      status.style.color="var(--red)";
    }
  });
}

let audioCtx=null;
function ensureAudio(){
  try{
    const C=window.AudioContext||window.webkitAudioContext;
    if(!C)return null;
    if(!audioCtx)audioCtx=new C();
    if(audioCtx.state==="suspended")audioCtx.resume().catch(()=>{});
    return audioCtx;
  }catch(e){return null}
}

// Unlock the Web Audio engine directly from a real user gesture.
function unlockAudio(){
  const c=ensureAudio();
  if(!c)return;
  try{
    const b=c.createBuffer(1,1,c.sampleRate);
    const s=c.createBufferSource();
    const g=c.createGain();
    g.gain.value=0.00001;
    s.buffer=b;s.connect(g);g.connect(c.destination);s.start(0);
    if(c.state==="suspended")c.resume().catch(()=>{});
  }catch(e){}
}

// Loud, clearly different feedback sounds — preserved from the original master test
// and made more reliable on mobile browsers.
function beep(correct){
  const c=ensureAudio();if(!c)return;
  const play=()=>{
    try{
      const now=c.currentTime+0.005;
      if(correct){
        // Bright 5-note success chime.
        [523.25,659.25,783.99,1046.50,1318.51].forEach((f,i)=>{
          const o=c.createOscillator(),g=c.createGain();
          const t=now+i*0.075;
          o.type="sine";o.frequency.setValueAtTime(f,t);
          g.gain.setValueAtTime(0.0001,t);
          g.gain.exponentialRampToValueAtTime(0.85,t+0.012);
          g.gain.exponentialRampToValueAtTime(0.0001,t+0.25);
          o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+0.27);
        });
      }else{
        // Deep, unmistakable wrong-answer buzzer.
        [220,174.61,146.83,110,82.41].forEach((f,i)=>{
          const o=c.createOscillator(),g=c.createGain();
          const t=now+i*0.075;
          o.type="square";o.frequency.setValueAtTime(f,t);
          g.gain.setValueAtTime(0.0001,t);
          g.gain.exponentialRampToValueAtTime(0.95,t+0.012);
          g.gain.exponentialRampToValueAtTime(0.0001,t+0.30);
          o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+0.32);
        });
      }
    }catch(e){}
  };
  if(c.state==="running")play();else c.resume().then(play).catch(()=>{});
}

function fireworks(good){
  const canvas=$("fx"),ctx=canvas.getContext("2d");
  const dpr=Math.min(devicePixelRatio||1,2);
  canvas.width=innerWidth*dpr;canvas.height=innerHeight*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const cx=innerWidth/2,cy=innerHeight*.48;
  const particles=[];
  const count=190;
  for(let i=0;i<count;i++){
    const a=Math.PI*2*i/count+(Math.random()-.5)*.045;
    const ring=i%3;
    const speed=(ring===0?3.4:ring===1?4.8:6.0)+Math.random()*1.8;
    particles.push({
      x:cx,y:cy,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,
      life:55+Math.random()*30,size:1.4+Math.random()*2.4,
      delay:Math.random()*5
    });
  }
  let frame=0;
  function draw(){
    ctx.clearRect(0,0,innerWidth,innerHeight);
    particles.forEach(p=>{
      if(frame<p.delay)return;
      p.x+=p.vx;p.y+=p.vy;p.vy+=.055;p.vx*=.994;p.vy*=.994;p.life--;
      if(p.life>0){
        ctx.globalAlpha=Math.min(1,p.life/22);
        ctx.fillStyle=good?"#18e76b":"#ff3152";
        ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
      }
    });
    ctx.globalAlpha=1;
    if(frame++<92)requestAnimationFrame(draw);else ctx.clearRect(0,0,innerWidth,innerHeight);
  }
  draw();
}

function formatTime(sec){
  sec=Math.max(0,Math.floor(Number(sec)||0));
  if(sec>=3600){
    const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),ss=sec%60;
    return h+":"+String(m).padStart(2,"0")+":"+String(ss).padStart(2,"0");
  }
  return String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0");
}

function parseCentralDateTime(value, baseDate){
  if(value===null || value===undefined || value==="") return NaN;
  const v=String(value).trim();
  if(!v) return NaN;

  // ISO / normal browser date strings.
  let t=Date.parse(v);
  if(Number.isFinite(t)) return t;

  // Common Central Sheet formats: DD/MM/YYYY HH:mm:ss, DD/MM/YYYY hh:mm AM/PM,
  // and similar comma-separated variants.
  let m=v.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})(?:[ ,T]+(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(AM|PM)?)?$/i);
  if(m){
    let day=Number(m[1]), mon=Number(m[2])-1, year=Number(m[3]);
    if(year<100) year+=2000;
    let hh=Number(m[4]||0), mm=Number(m[5]||0), ss=Number(m[6]||0);
    const ap=(m[7]||"").toUpperCase();
    if(ap){ if(hh===12) hh=0; if(ap==="PM") hh+=12; }
    const d=new Date(year,mon,day,hh,mm,ss,0);
    return Number.isFinite(d.getTime())?d.getTime():NaN;
  }

  // Time-only value such as 02:40 PM. Combine it with the supplied base date.
  m=v.match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(AM|PM)?$/i);
  if(m && baseDate){
    const b=new Date(baseDate);
    if(Number.isFinite(b.getTime())){
      let hh=Number(m[1]), mm=Number(m[2]), ss=Number(m[3]||0);
      const ap=(m[4]||"").toUpperCase();
      if(ap){ if(hh===12) hh=0; if(ap==="PM") hh+=12; }
      b.setHours(hh,mm,ss,0);
      return b.getTime();
    }
  }
  return NaN;
}

function formatCentralTimeUsed(raw,startExam,completedAt,resultDuration){
  const maxDuration=(Number(resultDuration)>0?Number(resultDuration):DURATION);

  // Connected result server format:
  // New records store Time Used as elapsed seconds. Display it as MM:SS
  // (or H:MM:SS for durations of one hour or more).
  if(raw!==null && raw!==undefined){
    if(typeof raw === "number" && Number.isFinite(raw)){
      const sec=Math.floor(raw);
      if(sec>=0 && sec<=maxDuration) return formatTime(sec);
    }

    const v=String(raw).trim();
    if(v){
      // Numeric strings are also elapsed seconds.
      if(/^\d+(?:\.\d+)?$/.test(v)){
        const sec=Math.floor(Number(v));
        if(sec>=0 && sec<=maxDuration) return formatTime(sec);
      }

      // Existing Central-style duration text: MM:SS or H:MM:SS.
      let m=v.match(/^(\d+):(\d{2})(?::(\d{2}))?$/);
      if(m){
        const sec=m[3]!==undefined
          ? Number(m[1])*3600+Number(m[2])*60+Number(m[3])
          : Number(m[1])*60+Number(m[2]);
        if(sec>=0 && sec<=maxDuration) return formatTime(sec);
      }

      // Older Google-Sheet date-formatted duration values can arrive as
      // 1899-12-31T... . Treat the clock portion as a duration ONLY when
      // it is within this test's allowed duration; never invent a duration.
      m=v.match(/(?:^|T)(\d{1,2}):(\d{2}):(\d{2})(?:\.\d+)?(?:Z|$)/i);
      if(m){
        const sec=Number(m[1])*3600+Number(m[2])*60+Number(m[3]);
        if(sec>=0 && sec<=maxDuration) return formatTime(sec);
      }
    }
  }

  // Fallback only when actual start/end timestamps are supplied by the
  // Central API. This is deliberately secondary to the original Time Used
  // value so the Central Scoreboard format remains unchanged.
  let endMs=parseCentralDateTime(completedAt);
  let startMs=parseCentralDateTime(startExam,endMs);
  if(Number.isFinite(startMs) && Number.isFinite(endMs)){
    if(endMs<startMs && (startMs-endMs)<24*3600*1000) endMs+=24*3600*1000;
    const elapsed=Math.floor((endMs-startMs)/1000);
    if(elapsed>=0 && elapsed<=maxDuration) return formatTime(elapsed);
  }

  return "—";
}

function sectionFor(q){ return "DISASTER MANAGEMENT • HAZARD • VULNERABILITY • RESPONSE • RECOVERY"; }

function render(){if(revisionMode){$("revisionBanner")?.classList.add("show");$("timer").textContent="00:00";}else{$("revisionBanner")?.classList.remove("show");}
  const list=revisionMode?revisionQuestions:QUESTIONS;
  const q=list[idx],a=(revisionMode?revisionAnswers:answers)[q.id]||"";
  $("progress").textContent=`Question ${idx+1} of ${list.length}${revisionMode?" · REVISION TEST":""}`;
  $("sectionLabel").textContent=sectionFor(q);
  const progressPct=list.length?Math.min(100,Math.max(0,(idx/list.length)*100)):0;
  const progressFill=$("progressFill");
  if(progressFill) progressFill.style.width=progressPct.toFixed(2)+"%";
  const ok=a===q.answer;
  // Correct answer: no explanation is shown. Wrong answer: only the Bengali explanation is shown.
  const fb=(a && !ok)?`<div class="explain"><div class="wrong-title">ভুল হয়েছে</div><div>${esc(q.explanation)}</div></div>`:"";
  const btnClass=a?(ok?"answer-correct":"answer-wrong"):"";
  $("qcard").innerHTML=`
    <div class="qnum">Q${q.id} · ${q.kind.toUpperCase()}</div>
    <div class="question">${esc(q.text)}</div>
    <div class="options">${q.options.map((o,i)=>{
      const L=letter(i);
      let cls="opt";
      if(a===L)cls+=" selected";
      if(a){if(q.answer===L)cls+=" correct";else if(a===L)cls+=" wrong"}
      return `<button type="button" class="${cls}" data-opt="${L}" ${a?"disabled":""}>
        <span class="letter">${L}.</span><span>${esc(o)}</span></button>`;
    }).join("")}</div>
    <div class="feedback ${a?(ok?"ok":"bad"):""}">${fb}</div>
    <div class="actions"><button id="nextBtn" class="next ${btnClass}" type="button" ${a?"":"disabled"}>${idx===list.length-1?"FINISH":"CONTINUE"}</button></div>`;
  $("qcard").querySelectorAll("[data-opt]").forEach(el=>el.onclick=()=>choose(el.dataset.opt));
  const nextBtn=$("nextBtn");
  // Strong haptic feedback on the REAL EXAM CONTINUE button.
  // Trigger vibration directly from the user's touch/pointer event so mobile browsers
  // (including browsers opened from WhatsApp) have the best chance to honor it.
  const continueVibrate=()=>{
    if(navigator.vibrate){try{navigator.vibrate([140,50,140,50,220])}catch(e){}}
    nextBtn.classList.remove("tap-vibrate");
    void nextBtn.offsetWidth;
    nextBtn.classList.add("tap-vibrate");
  };
  nextBtn.addEventListener("pointerdown",continueVibrate,{passive:true});
  nextBtn.addEventListener("touchstart",continueVibrate,{passive:true});
  nextBtn.onclick=()=>{
    nextBtn.classList.remove("tap-vibrate");void nextBtn.offsetWidth;nextBtn.classList.add("tap-vibrate");
    if(idx<list.length-1){idx++;render()}else revisionMode?finishRevision():submitExam()
  };
  if(a){
    // Force the vibration animation after the button is rendered.
    if(!ok){requestAnimationFrame(()=>{nextBtn.classList.remove("answer-wrong");void nextBtn.offsetWidth;nextBtn.classList.add("answer-wrong");});}
  }
  $("correctBtn").textContent=`CORRECT: ${countCorrectLive()}`;
}

function countCorrectLive(){let n=0;QUESTIONS.forEach(q=>{if(answers[q.id]===q.answer)n++});return n}

function choose(L){
  if(revisionMode){if(revisionSubmitted)return;const q=revisionQuestions[idx];if(revisionAnswers[q.id])return;revisionAnswers[q.id]=L;const ok=L===q.answer;beep(ok);fireworks(ok);render();return;}
  if(submitted)return;const q=QUESTIONS[idx];if(answers[q.id])return;answers[q.id]=L;const ok=L===q.answer;beep(ok);fireworks(ok);render();
}

function startExam(){
  unlockAudio();
  
  const n=$("candidate").value.trim();
  if(!n){$("candidate").focus();return}

  // Start immediately from the user's tap. Do not wait for the central
  // test registry/network, so WhatsApp/GitHub mobile launches remain smooth.
  // The configured duration is refreshed in the background.
  const startBtn=$("startBtn");
  if(startBtn)startBtn.disabled=true;
  ensureAudio();
  candidate=n;idx=0;answers={};submitted=false;warningGiven=false;
  startAt=Date.now();
  examStartAt=new Date(startAt).toISOString();
  $("start").classList.add("hidden");
  $("result").classList.add("hidden");
  $("admin").classList.add("hidden");
  $("exam").classList.remove("hidden");
  render();
  timerHandle=setInterval(tick,250);
  tick();
  if(startBtn)startBtn.disabled=false;

  // Fetch the Multi-Test duration after the exam has already started.
  // If the central registry is unavailable, the current/default duration remains.
  DURATION=30*60;
}

function tick(){
  const used=Math.floor((Date.now()-startAt)/1000),left=DURATION-used;
  $("timer").textContent=formatTime(Math.max(0,left));
  const lastTen=left<=600 && left>0;
  $("timer").classList.toggle("warn",lastTen);
  if(lastTen && !warningGiven){
    warningGiven=true;
    try{
      const c=ensureAudio();
      if(c){
        const playWarningTone=(delay)=>{
          setTimeout(()=>{
            try{
              const o=c.createOscillator(),g=c.createGain();
              o.type="square";
              o.frequency.setValueAtTime(880,c.currentTime);
              o.frequency.exponentialRampToValueAtTime(660,c.currentTime+0.22);
              g.gain.setValueAtTime(0.0001,c.currentTime);
              g.gain.exponentialRampToValueAtTime(0.28,c.currentTime+0.015);
              g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+0.28);
              o.connect(g);g.connect(c.destination);
              o.start();o.stop(c.currentTime+0.3);
            }catch(e){}
          },delay);
        };
        playWarningTone(0);
        playWarningTone(360);
        playWarningTone(720);
      }
    }catch(e){}
    setTimeout(()=>{if(!submitted) alert("⚠️ সতর্কবার্তা: পরীক্ষার শেষ ১০ মিনিট শুরু হয়েছে।");},50);
  }
  if(left<=0 && !submitted)submitExam();
}

function submitExam(){
  if(submitted)return;submitted=true;clearInterval(timerHandle);
  const used=Math.min(DURATION,Math.floor((Date.now()-startAt)/1000));
  let correct=0,attempted=0;
  QUESTIONS.forEach(q=>{if(answers[q.id]){attempted++;if(answers[q.id]===q.answer)correct++}});
  const incorrect=attempted-correct,unanswered=QUESTIONS.length-attempted;
  const result={
    id:(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()),
    candidate,score:correct,percentage:correct/QUESTIONS.length*100,correct,incorrect,attempted,unanswered,
    timeUsed:used,durationSeconds:DURATION,startExam:examStartAt||new Date().toISOString(),completedAt:new Date().toISOString(),answers:{...answers}
  };
  const arr=getResults();arr.push(result);saveResults(arr);
  mainResult=result;
  submitToCentralScoreboard(result);
  startRevision(result.answers);
}

    </div>

      <button onclick="window.print()">PRINT / SAVE PDF</button>
      <button onclick="location.reload()">BACK TO START</button>
    </div>
    <div class="review"><h3>ANSWER REVIEW</h3>${rows}</div>
  </div>`;
}

function startRevision(originalAnswers){
  revisionQuestions=QUESTIONS.filter(q=>originalAnswers[q.id] && originalAnswers[q.id]!==q.answer);
  if(!revisionQuestions.length){revisionMode=false;clearInterval(revisionTimerHandle);showResult(mainResult);return;}
  revisionMode=true;revisionAnswers={};revisionSubmitted=false;idx=0;revisionStartAt=Date.now();
  $("result").classList.add("hidden");$("admin").classList.add("hidden");$("start").classList.add("hidden");$("exam").classList.remove("hidden");
  $("timer").classList.remove("warn");$("timer").textContent="10:00";render();
  clearInterval(revisionTimerHandle);revisionTimerHandle=setInterval(tickRevision,250);tickRevision();
}

function fetchCentralJson(url, attempts=3){
  return new Promise((resolve,reject)=>{
    let lastError=null;
    const tryOnce=(n)=>{
      fetch(url,{
        method:"GET",
        mode:"cors",
        credentials:"omit",
        cache:"no-store",
        redirect:"follow"
      }).then(async r=>{
        const text=await r.text();
        const clean=text.trim();
        if(!r.ok) throw new Error("HTTP "+r.status);
        if(!clean || clean[0]==="<" || /^<!doctype/i.test(clean)){
          throw new Error("Central server returned HTML instead of JSON.");
        }
        try{
          resolve(JSON.parse(clean));
        }catch(e){
          throw new Error("Central server returned invalid JSON.");
        }
      }).catch(err=>{
        lastError=err;
        if(n<attempts){
          setTimeout(()=>tryOnce(n+1),700*n);
        }else{
          reject(lastError||new Error("Connection failed."));
        }
      });
    };
    tryOnce(1);
  });
}

}

function getCentralAdminCache(testId){
  try{
    const x=JSON.parse(localStorage.getItem(
      CENTRAL_ADMIN_CACHE_KEY+"_"+String(testId)
    )||"null");

  }catch(e){return null}
}

function renderCentralAdmin(){
  const wrap=$("adminTable");
  wrap.innerHTML='<div class="empty">Loading RESULTS…</div>';

}

function loadCentralAdminResults(){
  const area=$("adminTable");
  if(!area)return;
  area.innerHTML='<div class="empty">Loading results…</div>';

  // The Apps Script may still use the old server-side authentication contract.
  // Keep the test ID hidden from the UI, but send it only as a backend compatibility field.
  // The request carries both the admin password and API token so either supported
  // authentication path can authorize the single-test dashboard.
  // Use the same server contract used by the working central-scoreboard versions:
  // action=results + token + testId + password.
  const params=new URLSearchParams({
    action:"results",
    token:CENTRAL_API_TOKEN,
    testId:BACKEND_TEST_ID,
    password:adminPasswordSession,
    _:String(Date.now())
  });
  const url=CENTRAL_SCOREBOARD_URL+"?"+params.toString();

  fetchCentralJson(url,5)
    .then(data=>{
      // Different deployed Apps Script versions use either {ok:true} or {success:true}.
      const serverOK=!!(data && (data.ok===true || data.success===true));
      if(!serverOK)throw new Error(data&&data.error||"Unable to load results.");
      renderCentralResults(Array.isArray(data.results)?data.results:[]);
      saveCentralAdminCache("single",Array.isArray(data.results)?data.results:[]);
    })
    .catch(err=>{
      const cached=getCentralAdminCache("single");
      if(cached && Array.isArray(cached.data)){
        renderCentralResults(cached.data);
        const when=new Date(cached.savedAt).toLocaleString();
        area.insertAdjacentHTML("afterbegin",
          '<div class="empty" style="padding:8px 0;color:var(--gold)">SERVER TEMPORARILY UNAVAILABLE — showing the last successfully loaded results ('+esc(when)+'). Tap REFRESH RESULTS to try again.</div>'
        );
      }else{
        area.innerHTML='<div class="empty">SERVER TEMPORARILY UNAVAILABLE: '+esc(err.message||"Connection failed.")+'<br><br>Tap REFRESH RESULTS to try again.</div>';
      }
    });
}

function renderCentralResults(results){
  const area=$("adminTable");
  if(!area)return;
  if(!results.length){
    area.innerHTML='<div class="empty">No results found.</div>';
    return;
  }
  area.innerHTML=`
    <div class="tableWrap">
      <table>
        <thead><tr>
          <th>Candidate Name</th><th>Scored</th><th>Time Used</th><th>Start Exam</th><th>Percentage</th><th>Date</th>
        </tr></thead>
        <tbody>${results.map(r=>`
          <tr>
            <td>${esc(r.candidateName||r.candidate||"")}</td>
            <td>${esc(r.scored==null?(r.score==null?"":r.score):r.scored)}</td>
            <td>${formatCentralTimeUsed(r.timeUsed,r.startExam,r.date,r.durationSeconds)}</td>
            <td>${esc(r.startExam||"")}</td>
            <td>${esc(String(r.percentage==null?"":r.percentage))}%</td>
            <td>${esc(r.date||r.completedAt||"")}</td>
          </tr>`).join("")}</tbody>
      </table>
    </div>`;
}

function downloadCSV(){
  const rows=document.querySelectorAll("#adminTable table tbody tr");
  if(!rows.length){alert("No results to download.");return}
  const lines=[["Candidate Name","Scored","Time Used","Start Exam","Percentage","Date"]];
  rows.forEach(tr=>lines.push(Array.from(tr.cells).map(td=>td.textContent.trim())));
  const txt="\uFEFF"+lines.map(row=>row.map(v=>`"${String(v).replaceAll('"','""')}"`).join(",")).join("\r\n");
  const blob=new Blob([txt],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="Results.csv";a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
